<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas apps · Bup for Developers</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap"><link rel="stylesheet" href="/dev.css"></head><body>
<main><div class="page w"><div class="row"><div><h1>Conta de desenvolvedor</h1><p class="lead" id="who" style="margin-bottom:24px"></p></div><a class="btn" href="/criar-app"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Criar App</a></div>
<div id="gate" class="card" hidden><p class="lead" style="margin-bottom:20px">Entre na sua conta para ver suas aplicações.</p><a class="btn" href="/entrar?next=/painel">Entrar</a></div>
<div id="ls"></div></div></main>
<footer>Bup for Developers · O bot nunca recebe nem guarda a senha de ninguém.</footer><script src="/dev.js"></script>
<script>
const ls=document.getElementById('ls');
async function load(){const {apps}=await api('apps');ls.innerHTML=apps.length?'':'<div class="card"><p class="lead" style="margin:0 0 18px">Você ainda não tem aplicações.</p><a class="btn" href="/criar-app">Criar a primeira</a></div>';
for(const a of apps){const d=document.createElement('div');d.className='app';d.innerHTML='<div class="row"><h3>'+esc(a.name)+'</h3><span class="mono" style="color:var(--mut)">bup_sk_••••'+a.key_hint+'</span></div><p class="m">Bot de Discord · Conectar contas · '+a.linked+' conta(s) conectada(s) · criada em '+new Date(a.created_at).toLocaleDateString('pt-BR')+'</p><div class="acts"><button class="btn sm g" data-a="key">Pegar a API</button><button class="btn sm g" data-a="ren">Editar nome</button><a class="btn sm g" href="/docs">Documentação</a><button class="btn sm red" data-a="del">Excluir</button></div><div class="out"></div>';
const o=d.querySelector('.out'),run=async(b)=>{b.disabled=true;try{await b.f()}catch(x){alert(x.message)}b.disabled=false};
d.querySelector('[data-a=key]').onclick=e=>run({disabled:0,f:async()=>{if(!confirm('Gerar uma nova chave? A chave atual para de funcionar na hora.'))return;const r=await api('apps',{action:'regenerate',id:a.id});o.innerHTML='<p class="m" style="margin:14px 0 0">Copie agora. Ela não aparece de novo.</p><div class="key"><code>'+r.key+'</code><button class="btn sm">Copiar</button></div>';const b=o.querySelector('button');b.onclick=()=>copy(r.key,b);d.querySelector('.mono').textContent='bup_sk_••••'+r.key.slice(-4)}});
d.querySelector('[data-a=ren]').onclick=()=>{o.innerHTML='<div class="key"><input value="'+esc(a.name)+'" maxlength="40" aria-label="Novo nome" style="border:0;background:none;padding:6px 0"><button class="btn sm">Salvar</button></div>';const i=o.querySelector('input');i.focus();o.querySelector('button').onclick=()=>run({disabled:0,f:async()=>{await api('apps',{action:'rename',id:a.id,name:i.value});load()}})};
d.querySelector('[data-a=del]').onclick=()=>run({disabled:0,f:async()=>{if(!confirm('Excluir "'+a.name+'"? A chave deixa de funcionar e as conexões são apagadas.'))return;await api('apps',{action:'delete',id:a.id});load()}});
ls.append(d)}}
me().then(u=>{if(!u){gate.hidden=false;return}who.textContent=u.name+' · '+u.email;load().catch(x=>ls.textContent=x.message)});
</script></body></html>
